description: |
  The initial interaction of an Agent initiating the process of the identity proofing agent flow.
allOf:
  - type: object
    properties:
      proofing_agent_id:
        type: string
        description: The identification number of the agent that sent the request
      proofing_location_id:
        type: string
        description: The location ID of the agent that sent the request
      correlation_id:
        type: string
        description: The ID of the request
      transaction_id:
        type: string
        description: The ID of the request transaction
      first_name:
        type: string
      last_name:
        type: string
      date_of_birth:
        type: string
      address1:
        type: string
        description: Residential address line 1
      address2:
        type: string
        description: Residential address line 2
      city:
        type: string
        description: Residential address city
      state:
        type: string
        description: Residential address state
      zip:
        type: string
        description: Residential address zip
      phone:
        type: string
      ssn:
        type: string
      document_state_jurisdiction:
        type: string
        description: Driver's licenses document_state
      document_number:
        type: string
        description: Driver's license number or Passport Number
      document_issued:
        type: string
        description: Driver's license or passport date issued
      document_expiration:
        type: string
        description: Driver's license or passport expiration date
      document_address1:
        type: string
        description: Driver's license address line 1
      document_address2:
        type: string
        description: Driver's license address line 2
      document_city:
        type: string
        description: Driver's license address city
      document_state:
        type: string
        description: Driver's license address state
      document_zip:
        type: string
        description: Driver's license address zip
      failure_reason:
        type: object
        description: |
          An OPTIONAL object. An associative array of attributes and errors if success is false
        properties:
          proofing_agent_id:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
          proofing_location_id:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
          email:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 255 characters)'
                - 'must be a string'
          first_name:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 128 characters)'
                - 'must be a string'
          last_name:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 128 characters)'
                - 'must be a string'
          dob:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 10 characters)'
                - 'must be in YYYY-MM-DD format'
                - 'must be a string'
          dob_min_age:
            type: array
            items:
              type: string
              enum:
                - 'age does not meet minimum requirements'
                - 'must be a string'
          phone:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 20 characters)'
                - 'must be a string'
          ssn:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 9 characters)'
                - 'is too short (minimum is 9 characters)'
                - 'Enter a nine-digit Social Security number'
                - 'must contain only digits'
                - 'must be a string'
          id_type:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 20 characters)'
                - 'must be a string'
          jurisdiction:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is not a valid state code'
                - 'is too long (maximum is 64 characters)'
          state_id_type:
            type: array
            items:
              type: string
              enum:
                - 'mis-matched type vs data'
          passport_type:
            type: array
            items:
              type: string
              enum:
                - 'mis-matched type vs data'
          unknown_id_type:
            type: array
            items:
              type: string
              enum:
                - 'unsupported id_type'
                - 'is too long (maximum is 64 characters)'
          document_number:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
          residential_address:
            type: array
            items:
              type: string
              enum:
                - 'residential address must be present with passport'
          expiration_date:
            type: array
            items:
              type: string
              enum:
                - 'is expired, or near expiration'
          mrz:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
          issuing_country_code:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is not a valid issuing country code'
          address1:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 255 characters)'
                - 'has invalid characters'
          address2:
            type: array
            items:
              type: string
              enum:
                - 'is too long (maximum is 255 characters)'
                - 'has invalid characters'
          city:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is too long (maximum is 255 characters)'
                - 'has invalid characters'
          state:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is not a valid state code'
          zip_code:
            type: array
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'is invalid'
          state_id.expiration_date:
            type: array
            items:
              type: string
              enum:
                - 'must be in YYYY-MM-DD format'
                - 'is too long (maximum is 10 characters)'
          state_id.issued_date:
            type: array
            items:
              type: string
              enum:
                - 'must be in YYYY-MM-DD format'
                - 'is too long (maximum is 10 characters)'
          base:
            type: array
            description: The overall structure of the request
            items:
              type: string
              enum:
                - 'cannot be blank'
                - 'cannot include both state_id and passport'
                - 'either state_id or passport must be present'
          error:
            type: array
            items:
              type: string
              enum:
                - 'Missing required headers: X-Correlation-ID'
      success:
        type: boolean
        description: |
          Indicates whether the verification form was requested successfully
